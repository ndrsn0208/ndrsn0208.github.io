<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Continual learning for deployment-time adaptation and generalization. Research, publications, and illustrated essays by Zekun Wang, a Computer Science PhD student at Georgia Tech." />
    <meta property="og:title" content="Zekun Wang · Research &amp; writing" />
    <meta property="og:description" content="PhD student at Georgia Tech, currently interning at Amazon. Continual learning for deployment-time adaptation and generalization." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ndrsn0208.github.io/site-card.png" />
    <script>
      // Match the selected appearance before the homepage and fonts load.
      document.documentElement.setAttribute('data-theme', 'dark')
      ;(() => {
        const redirect = new URLSearchParams(location.search).get('_redirect')
        const destination = new URL(redirect || location.href, location.origin)
        const isSite = /^\/(?:blog(?:\/|$)|publications\/?$|about\/?$|cv\/?$|photography\/?$|$)/.test(destination.pathname)
        const isStudy = /^\/(?:still|typography|mobile|designs)(?:\/|$)/.test(destination.pathname)
        if (!isSite && isStudy) return
        const colors = { black: '#000000', paper: '#f5f1e8' }
        const current = (value) => value === 'stone' || value === 'line' ? 'paper' : value
        const valid = (value) => Object.prototype.hasOwnProperty.call(colors, value)
        let edition = current(destination.searchParams.get('edition'))
        if (!valid(edition)) {
          try { edition = current(localStorage.getItem('zekun-still-edition-v1')) } catch {}
        }
        if (!valid(edition)) edition = 'paper'
        const root = document.documentElement
        root.dataset.siteEdition = edition
        root.style.setProperty('--paper', colors[edition])
        root.style.setProperty('--still-screen', colors[edition])
        root.style.backgroundColor = colors[edition]
        root.style.colorScheme = edition === 'black' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = colors[edition]
      })()
    </script>
    <link rel="preload" href="/fonts/typography/newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/typography/source-sans-3-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Zekun Wang · Research &amp; writing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
