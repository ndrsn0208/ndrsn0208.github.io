# papers.toml — your publication list (edit by hand).
#
# Add an entry per paper. After editing, run:
#
#   python scripts/update_publications.py
#
# The script will:
#   • fetch title / authors / abstract from arxiv,
#   • cache the HTML version under public/arxiv-cache/,
#   • summarize via the local Claude Code CLI (no API key needed),
#   • generate the per-paper foil gradient,
#   • write src/data/publications.json.
#
# Once you commit publications.json, the deployed site runs zero AI calls
# in production — everything is baked in at update time.
#
# ── Schema ─────────────────────────────────────────────────────────────
#   arxiv  — arxiv id; bare ("2401.12345"), URL, or with `vN`
#   id + url — stable id and canonical page for papers without an arxiv record
#   venue  (optional) — e.g. "ICML 2026", "NeurIPS 2025". Defaults to
#                       "arXiv {YYYY}" inferred from the arxiv id.
#   award  (optional) — "spotlight", "oral", "best paper", etc. Renders
#                       as a small badge on the card and detail page.
#   year, title, authors, url, pdf_url, summary, tldr, tags, equal_contribution
#     override fetched metadata. A complete title/authors/summary/tldr/tags set
#     can create an entry offline. Tags must use config.researchInterests.
#
# Bibliography reconciled with the author-reviewed CV, September 18, 2026.
# Published venue pages and paper PDFs take precedence over arxiv title typos.
# ───────────────────────────────────────────────────────────────────────

[[paper]]
arxiv = "2609.13047"
title = "Diffusion Models and Concept Formation"
authors = ["Zekun Wang", "Karthik Singaravadivelan", "Christopher J. MacLellan"]
venue = "arXiv 2026"
summary = "The modes of a diffusion model's noisy distributions form a hierarchy of concepts, connecting its learned score field with Cobweb's probabilistic concept tree. The paper studies their shared structure and basic-level categories, then compares recovered hierarchies on MNIST and Fashion-MNIST. This offers a cognitive interpretation of diffusion as a continuous model of concept formation."
tldr = "A diffusion model's noise levels reveal a hierarchy of concepts, connecting image generation with how people organize knowledge."
tags = ["diffusion models", "concept learning"]

[[paper]]
arxiv = "2606.14040"
title = "Decompose Sparsely Where You Should, Absorb Densely Where You Should Not"
authors = ["Ruixuan Deng", "Zehao Jin", "Zekun Wang", "Zihan Dong"]
venue = "ICML 2026 Mechanistic Interpretability Workshop"
award = "Poster"
url = "https://openreview.net/forum?id=GhH9CY7Ohk"
summary = "Not all language-model activations are well represented by a sparse dictionary. Adding a small dense linear bottleneck alongside sparse autoencoders separates a low-rank computational scaffold from sparse features. Experiments on Gemma-2-2B show fewer dense latents and better sparse probing, while ablations reveal the scaffold's importance to the model's predictions."
tldr = "Separating a compact, dense scaffold from sparse features helps explain what sparse autoencoders capture—and what they represent poorly."
tags = ["language models", "concept learning"]

