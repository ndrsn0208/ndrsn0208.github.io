[[paper]]
arxiv = "2610.02616"
id = "verse-verified-self-evolving-optimizer-2026"
title = "VERSE: Verified Self-Evolving Optimizer for Agent Harnesses"
authors = ["Zekai Wang", "Yingqiang Ge", "Zekun Wang", "Hai Wang", "Yuhui Xu", "Joshua Frandsen", "Shancong Fu", "Ashia C. Wilson", "Chandan K. Reddy"]
venue = "arXiv 2026"
publication_date = "2026-10-02"
summary = "VERSE combines execution-based verification with an optimizer that evolves its own harness. It tests draft edits, replays failures, and tracks fixes and regressions to revise both the executor harness and the optimizer's tools and procedures while keeping model weights fixed. Experiments evaluate the resulting harnesses on held-out software engineering tasks and newer tasks in five programming languages."
tldr = "Execution checks guide an optimizer that improves both an agent's harness and its own tools and procedures."
tags = ["continual learning", "language models"]
