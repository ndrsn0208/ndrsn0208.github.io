summary = "In the low-SNR regime near convergence, this work derives a rank-1 approximation to the Fisher information for diffusion models and combines the resulting EWC penalty with generative distillation. It reduces mean FID-based forgetting by 67% relative to generative distillation alone on ImageNet-1k (32×32, 20 tasks), and nearly eliminates forgetting on MNIST and Fashion-MNIST."

